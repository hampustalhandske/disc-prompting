[project]
name = "disc-mirror"
version = "0.1.0"
description = "Do LLMs mirror the DISC style of a question?"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "litellm",
    "open-clip-torch>=4.2.2",
    "pyyaml",
    "resvg-py>=0.5.0",
    "torch>=2.15.0",
    "vadersentiment>=3.3.2",
]

[project.scripts]
disc-run = "disc_mirror.cli:main"
disc-classify = "disc_mirror.cli:classify_main"
disc-grade = "disc_mirror.cli:grade_main"
disc-fetch = "disc_mirror.fetch:main"

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/disc_mirror"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
